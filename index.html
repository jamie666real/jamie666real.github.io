<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8fafc">
  <title>ZayZay | jamie666real.github.io</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg-color: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #475569;
      --accent: #2563eb;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --badge-bg: #eff6ff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #60a5fa;
        --card-bg: #1e293b;
        --border-color: #334155;
        --badge-bg: #1e3a8a;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 3rem 1.5rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
    }

    .container { max-width: 1000px; margin: 0 auto; }

    header {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    h1 { margin: 0 0 0.25rem; font-size: 2.25rem; font-weight: 800; }
    .subtitle, .status { color: var(--text-muted); }
    .subtitle { margin: 0; font-size: 1.1rem; }
    .status { margin: 0 0 1rem; }

    .repo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
      gap: 1.25rem;
    }

    .repo-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 160px;
      padding: 1.5rem;
      color: inherit;
      text-decoration: none;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .repo-card:hover, .repo-card:focus-visible {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .repo-title { margin: 0 0 0.5rem; color: var(--accent); font-size: 1.15rem; overflow-wrap: anywhere; }
    .repo-desc { flex-grow: 1; margin: 0 0 1.25rem; color: var(--text-muted); font-size: 0.95rem; }
    .repo-meta { display: flex; align-items: center; justify-content: space-between; gap: 1rem; color: var(--text-muted); font-size: 0.85rem; }
    .badge { padding: 0.2rem 0.6rem; color: var(--accent); background: var(--badge-bg); border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .error { color: #dc2626; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ZayZay</h1>
      <p class="subtitle">Projects &amp; Repositories by @jamie666real</p>
    </header>

    <main>
      <p id="status" class="status" role="status" aria-live="polite">Loading repositories…</p>
      <div id="repo-list" class="repo-grid"></div>
    </main>
  </div>

  <script>
    const username = 'jamie666real';
    const repoList = document.getElementById('repo-list');
    const status = document.getElementById('status');

    async function fetchRepos() {
      try {
        const repos = [];
        let page = 1;

        // The public GitHub API returns at most 100 repositories per page.
        while (true) {
          const response = await fetch(
            `https://api.github.com/users/${encodeURIComponent(username)}/repos?type=owner&sort=updated&per_page=100&page=${page}`,
            { headers: { Accept: 'application/vnd.github+json' } }
          );

          if (!response.ok) {
            throw new Error(response.status === 403 || response.status === 429
              ? 'GitHub API rate limit reached. Please try again later.'
              : `GitHub returned an error (${response.status}).`);
          }

          const pageRepos = await response.json();
          repos.push(...pageRepos);
          if (pageRepos.length < 100) break;
          page += 1;
        }

        repoList.replaceChildren();
        status.textContent = `${repos.length} public ${repos.length === 1 ? 'repository' : 'repositories'}`;

        if (repos.length === 0) {
          status.textContent = 'No public repositories found.';
          return;
        }

        for (const repo of repos) {
          const card = document.createElement('a');
          card.className = 'repo-card';
          card.href = repo.html_url;
          card.target = '_blank';
          card.rel = 'noopener noreferrer';

          const details = document.createElement('div');
          const title = document.createElement('h2');
          title.className = 'repo-title';
          title.textContent = repo.name;
          const description = document.createElement('p');
          description.className = 'repo-desc';
          description.textContent = repo.description || 'No description provided.';
          details.append(title, description);

          const meta = document.createElement('div');
          meta.className = 'repo-meta';
          const language = document.createElement('span');
          if (repo.language) {
            language.className = 'badge';
            language.textContent = repo.language;
          }
          const stars = document.createElement('span');
          stars.textContent = `★ ${repo.stargazers_count}`;
          meta.append(language, stars);
          card.append(details, meta);
          repoList.appendChild(card);
        }
      } catch (error) {
        status.textContent = error.message || 'Could not load repositories. Please try again later.';
        status.classList.add('error');
        console.error('Unable to load GitHub repositories:', error);
      }
    }

    fetchRepos();
  </script>
</body>
</html>
